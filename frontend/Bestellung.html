<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bestellung erfassen</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<h2>Bestellung erfassen</h2>

<form id="orderForm">
  <label>Kunde:</label>
  <select id="kundeSelect" required></select>

  <label>Produkt:</label>
  <select id="produktSelect" required></select>

  <label>Menge:</label>
  <input type="number" id="menge" min="1" value="1" required>

  <button type="button" id="addProductBtn">Produkt hinzufügen</button>
</form>

<h3>Ausgewählte Produkte</h3>
<table id="orderTable">
  <thead>
    <tr><th>Produkt</th><th>Menge</th><th>Einzelpreis</th><th>Summe</th><th>Aktion</th></tr>
  </thead>
  <tbody></tbody>
</table>

<h3>Gesamtpreis: <span id="gesamtpreis">0.00</span> €</h3>

<button id="saveOrderBtn">Bestellung speichern</button>

<script>
let produkte = [];
let warenkorb = [];
const kundeSelect = document.getElementById("kundeSelect");
const produktSelect = document.getElementById("produktSelect");
const mengeEl = document.getElementById("menge");

async function loadData() {
  // Kunden laden
  try {
    const kundenRes = await fetch("http://localhost:3000/api/kunden");
    if (kundenRes.ok) {
      const kunden = await kundenRes.json();
      kundeSelect.innerHTML = '<option value="">Bitte Kunde wählen</option>';
      kunden.forEach(k => {
        const opt = document.createElement("option");
        opt.value = k.id;
        opt.textContent = k.name;
        kundeSelect.appendChild(opt);
      });
    } else {
      kundeSelect.innerHTML = '<option value="">Keine Kunden</option>';
    }
  } catch (err) {
    console.error("Kunden laden fehler:", err);
    kundeSelect.innerHTML = '<option value="">Fehler</option>';
  }

  // Produkte laden
  try {
    const prodRes = await fetch("http://localhost:3000/api/produkte");
    if (prodRes.ok) {
      produkte = await prodRes.json();
      produktSelect.innerHTML = '<option value="">Bitte Produkt wählen</option>';
      produkte.forEach(p => {
        const opt = document.createElement("option");
        opt.value = p.id;
        opt.textContent = `${p.name} (${Number(p.preis).toFixed(2)} €)`;
        produktSelect.appendChild(opt);
      });
    } else {
      produktSelect.innerHTML = '<option value="">Keine Produkte</option>';
    }
  } catch (err) {
    console.error("Produkte laden fehler:", err);
    produktSelect.innerHTML = '<option value="">Fehler</option>';
  }
}

document.getElementById("addProductBtn").onclick = () => {
  const prodId = produktSelect.value;
  const menge = parseInt(mengeEl.value, 10);
  if (!prodId) return alert("Produkt auswählen!");
  if (!Number.isInteger(menge) || menge <= 0) return alert("Menge muss größer 0 sein.");

  const produkt = produkte.find(p => p.id === prodId);
  if (!produkt) return alert("Produkt nicht gefunden.");

  warenkorb.push({
    produktId: produkt.id,
    name: produkt.name,
    menge,
    einzelpreis: produkt.preis
  });

  renderTable();
};

function renderTable() {
  const tbody = document.querySelector("#orderTable tbody");
  tbody.innerHTML = "";
  let total = 0;

  warenkorb.forEach((item, index) => {
    const summe = item.menge * item.einzelpreis;
    total += summe;
    const row = document.createElement("tr");
    row.innerHTML = `
      <td>${escapeHtml(item.name)}</td>
      <td>${item.menge}</td>
      <td>${Number(item.einzelpreis).toFixed(2)}€</td>
      <td>${summe.toFixed(2)}€</td>
      <td><button class="removeBtn" data-index="${index}">X</button></td>
    `;
    tbody.appendChild(row);
  });

  document.getElementById("gesamtpreis").textContent = total.toFixed(2);

  tbody.querySelectorAll(".removeBtn").forEach(b => b.addEventListener("click", (ev) => {
    const idx = Number(ev.target.dataset.index);
    werekorb.splice(idx, 1);
    renderTable();
  }));
}

document.getElementById("saveOrderBtn").onclick = async () => {
  if (warenkorb.length === 0) return alert("Keine Produkte hinzugefügt!");
  if (!kundeSelect.value) return alert("Bitte Kunde auswählen!");

  const bestellung = {
    kundeId: kundeSelect.value,
    produkte: warenkorb.map(item => ({
      produktId: item.produktId,
      menge: item.menge,
      einzelpreis: item.einzelpreis
    }))
  };

  try {
    const res = await fetch("http://localhost:3000/api/bestellungen", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(bestellung)
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || "Serverfehler beim Speichern der Bestellung");
    }

    const data = await res.json();
    alert("Bestellung gespeichert!");
    // optional: Weiterleitung oder Reset
    warenkorb = [];
    renderTable();
    // ggf. reload oder redirect zur Bestellungsliste
  } catch (err) {
    console.error(err);
    alert(err.message || "Fehler beim Speichern");
  }
};

function escapeHtml(s) {
  if (!s && s !== 0) return "";
  return String(s).replace(/[&<>"']/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

loadData();
</script>

</body>
</html>
