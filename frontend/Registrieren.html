<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrieren</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Registrierungsformular: erstellt neuen Benutzer via API und loggt nach Erfolg ein -->
  <form id="registerForm">
    <h2>Registrieren</h2>

    <label for="username">Benutzername:</label>
    <input type="text" id="username" name="username" placeholder="Benutzername" required>

    <label for="password">Passwort:</label>
    <input type="password" id="password" name="password" placeholder="Passwort" required>

    <button type="submit">Registrieren</button>
    <button type="button" onclick="location.href='anmelden.html'">Anmelden</button>
  </form>

<script>
// Formular-Referenz
const registerForm = document.getElementById("registerForm");

// Behandle Registrierung: einfache Validierung und POST an API
registerForm.addEventListener("submit", async (e) => {
  e.preventDefault();

  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();

  if (!username || !password) {
    alert("Bitte Benutzername und Passwort eingeben.");
    return;
  }

  try {
    // Sende Registrierungsdaten an Backend
    const res = await fetch("http://localhost:3000/api/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });

    const result = await res.json().catch(() => ({ error: "Ungültige Serverantwort" }));

    if (res.ok) {
      // Registrierung erfolgreich: lokal speichern und zur Hauptseite
      localStorage.setItem("bauer", JSON.stringify(result.bauer || { username }));
      window.location.href = "hauptseite.html";
    } else {
      // Fehler vom Server anzeigen
      alert(result.error || "Fehler bei der Registrierung");
    }
  } catch (err) {
    console.error(err);
    alert("Server nicht erreichbar.");
  }
});
</script>
</body>
</html>
