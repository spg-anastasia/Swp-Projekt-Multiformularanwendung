<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrieren</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <form id="registerForm">
    <h2>Registrieren</h2>

    <label for="username">Benutzername:</label>
    <input type="text" id="username" name="username" placeholder="Benutzername" required>

    <label for="password">Passwort:</label>
    <input type="password" id="password" name="password" placeholder="Passwort" required>

    <button type="submit">Registrieren</button>
    <button type="button" onclick="location.href='Anmelden.html'">Anmelden</button>
  </form>

<script>
const registerForm = document.getElementById("registerForm");

registerForm.addEventListener("submit", async (e) => {
  e.preventDefault();

  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();

  if (!username || !password) {
    alert("Bitte Benutzername und Passwort eingeben.");
    return;
  }

  const data = { username, password };

  try {
    const res = await fetch("http://localhost:3000/api/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });

    // Debug-Infos
    console.log("Status:", res.status, res.statusText);
    const contentType = res.headers.get("content-type") || "";
    console.log("Content-Type:", contentType);

    const text = await res.text();
    console.log("Antwort (raw):", text);

    let result;
    if (contentType.includes("application/json")) {
      try {
        result = JSON.parse(text);
      } catch (err) {
        console.warn("Ungültiges JSON:", err);
        result = { error: "Ungültiges JSON vom Server", raw: text };
      }
    } else {
      result = { error: "Server hat kein JSON zurückgegeben", raw: text };
    }

    if (res.ok) {
      alert("Registrierung erfolgreich!");
      window.location.href = "Anmelden.html";
    } else {
      alert(result.error || "Fehler bei der Registrierung");
    }
  } catch (err) {
    console.error("Fehler beim Fetch:", err);
    alert("Server konnte nicht erreicht werden.");
  }
});
</script>
</body>
</html>
