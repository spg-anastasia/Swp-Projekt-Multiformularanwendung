<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Statistik</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<h2>Produkt-Statistik</h2>

<table id="statsTable">
  <thead>
    <tr><th>Produkt</th><th>Anzahl Bestellungen</th></tr>
  </thead>
  <tbody></tbody>
</table>

<script>
async function loadStats() {
  const res = await fetch("http://localhost:3000/api/statistik/produkte");
  const stats = await res.json();

  const tbody = document.querySelector("#statsTable tbody");
  tbody.innerHTML = "";

  stats.forEach(s => {
    const row = document.createElement("tr");
    row.innerHTML = `<td>${s.produkt}</td><td>${s.anzahl}</td>`;
    tbody.appendChild(row);
  });
}

loadStats();
</script>

</body>
</html>
