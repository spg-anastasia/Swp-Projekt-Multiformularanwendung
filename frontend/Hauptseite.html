<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Bauernhof-Shop</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Hauptseite: Begrüßung, Navigation und Abmelden -->
    <header id="siteHeader">Bauernhof-Shop
      <button id="logoutBtn">Abmelden</button>
    </header>

    <div id="startseite">
      <h2 id="welcomeLine">Willkommen</h2>
      <p id="intro">Fügen Sie neue Produkte und Bestellungen hinzu.</p>

      <div class="nav">
          <a href="Produktverwaltung.html">Produktverwaltung</a>
          <a href="Kundenverwaltung.html">Kunde erstellen</a>
          <a href="Bestellung.html">Bestellung erfassen</a>
          <a href="Statistik.html">Produktstatistik</a>
          <a href="bestellungAnzeigen.html">Bestellungen anzeigen</a>
      </div>
    </div>
    <div id="animals">🐄 🐖 🐑 🐓 🐐 🌳</div>

    <script>
      // kleine HTML-Escaper-Hilfe
      function escapeHtml(str) {
        if (!str && str !== 0) return '';
        return String(str).replace(/[&<>"']/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
      }

      // Beim Laden: prüfen ob ein Benutzer lokal gespeichert ist und Namen anzeigen
      window.addEventListener('load', () => {
        const stored = localStorage.getItem('bauer');
        if (!stored) {
          // kein eingeloggter Nutzer -> Anmeldeseite
          window.location.href = "anmelden.html";
          return;
        }

        // gespeicherten Benutzer parsen (falls JSON) und anzeigen
        let user;
        try {
          user = JSON.parse(stored);
        } catch {
          user = stored;
        }

        const username = (user && (user.username || user.name)) ? (user.username || user.name) : String(user);
        const welcomeEl = document.getElementById('welcomeLine');
        welcomeEl.textContent = 'Willkommen, ' + escapeHtml(username);
      });
    </script>
    <script>
  const logoutBtn = document.getElementById('logoutBtn');
  logoutBtn.addEventListener('click', () => {
        // Abmelden: Sitzung löschen und zur Start-/Anmeldeseite
        localStorage.removeItem('bauer'); // Löscht nur lokale Sitzung
        window.location.href = 'ersteSeite.html';
  });
</script>
</body>
</html>
