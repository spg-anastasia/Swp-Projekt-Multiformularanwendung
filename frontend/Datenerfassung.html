<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produkt erfassen</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<form id="productForm">
  <!-- Produkt-Erfassungsformular: Name, Beschreibung, Preis und Kategorie -->
  <a href="hauptseite.html" class="menuButton">Menü</a>
  <header><h1>Produkt erfassen</h1></header>
  

  <label for="name">Name:</label>
  <input type="text" id="name" placeholder="Produktname" required>

  <label for="beschreibung">Beschreibung:</label>
  <input type="text" id="beschreibung" placeholder="Beschreibung" required>

  <label for="preis">Preis (€):</label>
  <input type="number" id="preis" placeholder="Preis" step="0.01" required>

  <label for="kategorie">Kategorie:</label>
  <select id="kategorie" required>
    <option value="">Bitte Kategorie wählen</option>
  </select>
  <div id="kategorie-hinweis" style="color:#b00;margin-top:0.5rem;"></div>

  <button type="submit" id="saveBtn">Speichern</button>
</form>

<script>
async function loadCategories() {
  const select = document.getElementById("kategorie");
  const hint = document.getElementById("kategorie-hinweis");
  const saveBtn = document.getElementById("saveBtn");

  select.innerHTML = '<option value="">Bitte Kategorie wählen</option>';
  hint.textContent = '';
  saveBtn.disabled = true;

  try {
    // Kategorien vom Backend laden, damit das Produkt einer Kategorie zugeordnet werden kann
    const res = await fetch("http://localhost:3000/api/kategorien");
    if (!res.ok) throw new Error("Kategorien konnten nicht geladen werden");
    const categories = await res.json();

    // Wenn keine Kategorien vorhanden sind, Nutzer informieren (Speichern deaktiviert)
    if (!Array.isArray(categories) || categories.length === 0) {
      hint.textContent = "Keine Kategorien in der Datenbank vorhanden. Bitte zuerst Kategorien anlegen.";
      return;
    }

    // Optionen bauen
    categories.forEach(cat => {
      const option = document.createElement("option");
      option.value = String(cat.id);
      option.textContent = cat.name;
      select.appendChild(option);
    });

    // Kategorien vorhanden -> Speichern erlauben
    saveBtn.disabled = false;
  } catch (err) {
    console.error("Fehler beim Laden der Kategorien:", err);
    hint.textContent = "Fehler beim Laden der Kategorien — Server prüfen.";
  }
}

document.getElementById("productForm").addEventListener("submit", async e => {
  e.preventDefault();
  const saveBtn = document.getElementById("saveBtn");
  saveBtn.disabled = true;

  const nameEl = document.getElementById("name");
  const beschreibungEl = document.getElementById("beschreibung");
  const preisEl = document.getElementById("preis");
  const kategorieEl = document.getElementById("kategorie");

  const payload = {
    name: nameEl.value.trim(),
    beschreibung: beschreibungEl.value.trim(),
    preis: parseFloat(preisEl.value),
    kategorieId: kategorieEl.value
  };

  // einfache Validierung
  if (!payload.name || !payload.beschreibung || isNaN(payload.preis) || !payload.kategorieId) {
    // Fehlende/ungültige Daten
    alert("Bitte alle Felder korrekt ausfüllen.");
    saveBtn.disabled = false;
    return;
  }

  try {
    const res = await fetch("http://localhost:3000/api/produkte", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const result = await res.json().catch(() => ({}));
    if (res.ok) {
      // Erfolgreich: Benutzer informieren und zurück zur Übersicht
      alert("Produkt gespeichert: " + (result.name || payload.name));
      window.location.href = "Produktverwaltung.html";
    } else {
      alert(result.error || "Fehler beim Speichern des Produkts");
      saveBtn.disabled = false;
    }
  } catch (err) {
    console.error(err);
    alert("Server nicht erreichbar.");
    saveBtn.disabled = false;
  }
});

window.addEventListener('load', loadCategories);
</script>

</body>
</html>
