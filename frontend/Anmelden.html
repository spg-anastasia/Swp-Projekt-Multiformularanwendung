<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anmelden</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Anmeldeformular: Benutzer gibt Benutzername und Passwort ein, Login-Request an Backend gesendet--> 
  <form id="loginForm">
    <h2>Anmelden</h2>

    <label for="username">Benutzername:</label>
    <input type="text" id="username" name="username" placeholder="Benutzername" required>

    <label for="password">Passwort:</label>
    <input type="password" id="password" name="password" placeholder="Passwort" required>

    <button type="submit">Anmelden</button>
    <button type="button" onclick="location.href='registrieren.html'">Registrieren</button>
  </form>

<script>
// Referenz auf das Formular
const loginForm = document.getElementById("loginForm");

// Formular-Submit: Eingaben validieren und Login-Request senden
loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();

  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();

  if(!username || !password) {
    alert("Bitte Benutzername und Passwort eingeben.");
    return;
  }

  try {
    // Anfrage an API senden
    const res = await fetch("http://localhost:3000/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });

    const result = await res.json().catch(() => ({ error: "Ungültige Serverantwort" }));

    if (res.ok) {
      // Login erfolgreich: Benutzer lokal speichern und weiterleiten
      localStorage.setItem("bauer", JSON.stringify(result.bauer || { username }));
      window.location.href = "hauptseite.html";
    } else {
      // API meldet Fehler
      alert(result.error || "Fehler beim Anmelden");
    }
  } catch (err) {
    console.error(err);
    alert("Server nicht erreichbar.");
  }
});
</script>
</body>
</html>
