<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anmelden</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <form id="loginForm">
    <h2>Anmelden</h2>

    <label for="username">Benutzername:</label>
    <input type="text" id="username" placeholder="Benutzername" required>

    <label for="password">Passwort:</label>
    <input type="password" id="password" placeholder="Passwort" required>

    <button type="submit">Anmelden</button>
    <button type="button" onclick="location.href='Registrieren.html'">Registrieren</button>
  </form>

<script>
const loginForm = document.getElementById("loginForm");

loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();

  const data = {
    username: loginForm.username.value.trim(),
    password: loginForm.password.value.trim()
  };

  if(!data.username || !data.password) {
    alert("Bitte Benutzername und Passwort eingeben.");
    return;
  }

  try {
    const res = await fetch("http://localhost:3000/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });

    const text = await res.text();
    let result;
    try {
      result = JSON.parse(text);
    } catch {
      result = { error: "Server hat kein JSON zurückgegeben" };
    }

    if(res.ok) {
      alert("Login erfolgreich!");
      // Hier kannst du weiterleiten oder Token speichern
      // Beispiel: window.location.href = "dashboard.html";
    } else {
      alert(result.error || "Fehler beim Login");
    }

  } catch (err) {
    console.error("Fehler beim Fetch:", err);
    alert("Server konnte nicht erreicht werden.");
  }
});
</script>
</body>
</html>
